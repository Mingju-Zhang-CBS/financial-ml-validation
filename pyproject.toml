[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-ml-validation"
version = "0.2.0"
description = "Independent, reproducible quantitative finance portfolio research"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.6,<5",
  "catboost>=1.2.8,<2",
  "matplotlib>=3.9,<4",
  "psutil>=6,<8"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
equity = ["pyarrow==26.0.0"]

[tool.setuptools.packages.find]
include = ["ml_validation*"]

[tool.setuptools.package-data]
ml_validation = ["datasets/*.csv", "datasets/*.json", "equity/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
