<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="435" viewBox="0 0 1200 435" role="img" aria-labelledby="title desc"><title id="title">Research workflow</title><desc id="desc">1. Validate inputs: Join unique row IDs and define the next-period sign.; 2. Isolate dates: Forward purge for known time; grouped splits otherwise.; 3. Learn within folds: Fit imputation, scaling and category maps on training.; 4. Compare hypotheses: Three models and three fixed feature ablations.; 5. Freeze then confirm: Select on development; evaluate one confirmation stage.; 6. Explain uncertainty: Paired date bootstrap, group diagnostics and artifacts.</desc><rect width="1200" height="435" rx="16" fill="#f3f6f9" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#668096" /></marker></defs><text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#20364c" font-weight="700">From input contract to documented conclusion</text><rect x="20" y="82" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="40" y="111" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">01  VALIDATE INPUTS</text><text x="40" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Join unique row IDs and define</text><text x="40" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">the next-period sign.</text><rect x="420" y="82" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="440" y="111" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">02  ISOLATE DATES</text><text x="440" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Forward purge for known time;</text><text x="440" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">grouped splits otherwise.</text><rect x="820" y="82" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="840" y="111" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">03  LEARN WITHIN FOLDS</text><text x="840" y="141" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Fit imputation, scaling and</text><text x="840" y="164" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">category maps on training.</text><rect x="820" y="263" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="840" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">04  COMPARE HYPOTHESES</text><text x="840" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Three models and three fixed</text><text x="840" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">feature ablations.</text><rect x="420" y="263" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="440" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">05  FREEZE THEN CONFIRM</text><text x="440" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Select on development; evaluate</text><text x="440" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">one confirmation stage.</text><rect x="20" y="263" width="360" height="112" rx="10" fill="white" stroke="#d5e0e8" /><text x="40" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#157f77" font-weight="700">06  EXPLAIN UNCERTAINTY</text><text x="40" y="322" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">Paired date bootstrap, group</text><text x="40" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#20364c" font-weight="400">diagnostics and artifacts.</text><line x1="383" y1="138" x2="413" y2="138" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="783" y1="138" x2="813" y2="138" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="1000" y1="199" x2="1000" y2="255" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="813" y1="319" x2="783" y2="319" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><line x1="413" y1="319" x2="383" y2="319" stroke="#668096" stroke-width="2" marker-end="url(#arrow)" /><text x="30" y="414" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#526b80" font-weight="400">Inputs, timing assumptions and evidence remain explicit at every stage.</text></svg>