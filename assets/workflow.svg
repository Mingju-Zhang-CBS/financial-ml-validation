<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">Features before the decision, labels after it</title><desc id="desc">Observe at t, allow a full publication session, decide at 9 AM on t plus two, then begin the twenty-session yield-change target with that day's later measurement. Training waits for the label's publication allowance.</desc><rect width="1200" height="410" rx="14" fill="#f5f1e9"/><text x="42" y="64" font-family="Georgia,serif" font-size="34" fill="#101928">A prediction needs a future origin, not a stale starting quote.</text><path d="M85 145H1110" stroke="#b6ad9e" stroke-width="2"/><g font-family="Arial,sans-serif"><g fill="#167d8d"><circle cx="92" cy="145" r="9"/><circle cx="375" cy="145" r="9"/><circle cx="666" cy="145" r="9"/><circle cx="960" cy="145" r="9"/></g><g fill="#101928" font-size="26"><text x="57" y="209">Observe</text><text x="335" y="209">Decide</text><text x="626" y="209">Start target</text><text x="920" y="209">Finish target</text></g><g fill="#566473" font-size="23"><text x="57" y="250">Yields through t</text><text x="335" y="250">t+2 at 09:00 ET</text><text x="626" y="250">Later on t+2</text><text x="920" y="250">20 sessions later</text><text x="57" y="289">Then publication lag</text><text x="335" y="289">Features already known</text><text x="626" y="289">Future reference yield</text><text x="920" y="289">Then label availability</text></g><text x="42" y="370" font-size="22" fill="#8a6037">Known training labels only · current-vintage revisions remain a limitation · no trading-return claim</text></g></svg>
