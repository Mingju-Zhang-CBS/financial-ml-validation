name: tests-and-offline-demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install pyarrow==26.0.0
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m ml_validation --real --output local-runs/ci-real
      - run: python -m ml_validation --output local-runs/ci-synthetic
      - run: python -m ml_validation.equity --fixture --output local-runs/ci-equity-fixture
      - run: python examples/explain_treasury_clock.py
      - run: python examples/explain_validation.py
